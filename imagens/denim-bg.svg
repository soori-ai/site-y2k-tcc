<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <defs>

    <!-- TRAMA DO TECIDO JEANS -->
    <pattern id="denim" width="12" height="12" patternUnits="userSpaceOnUse">

      <!-- Base azul denim -->
      <rect width="12" height="12" fill="#416f86"/>

      <!-- Fios diagonais claros -->
      <path
        d="M-3 3 L3 -3 M0 12 L12 0 M9 15 L15 9"
        stroke="#a5bec8"
        stroke-width="2"
        opacity="0.62"
      />

      <!-- Fios diagonais escuros -->
      <path
        d="M-3 9 L9 -3 M3 15 L15 3"
        stroke="#234b63"
        stroke-width="2"
        opacity="0.72"
      />

      <!-- Pequenos fios verticais -->
      <path
        d="M2 0 L2 12 M8 0 L8 12"
        stroke="#d2dfe4"
        stroke-width="0.6"
        opacity="0.20"
      />

    </pattern>


    <!-- LUZ E DESGASTE DO JEANS -->
    <radialGradient id="shine" cx="32%" cy="25%" r="75%">

      <stop
        offset="0%"
        stop-color="#b9cdd5"
        stop-opacity="0.46"
      />

      <stop
        offset="38%"
        stop-color="#7296a7"
        stop-opacity="0.10"
      />

      <stop
        offset="72%"
        stop-color="#355f76"
        stop-opacity="0.08"
      />

      <stop
        offset="100%"
        stop-color="#173d54"
        stop-opacity="0.40"
      />

    </radialGradient>


    <!-- Pequena suavização -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.15"/>
    </filter>

  </defs>


  <!-- =========================================
       BOLINHAS JEANS
       ========================================= -->

